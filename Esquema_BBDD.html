
<div id="erd" style="padding:1rem 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  actor {
    int actor_id PK
    varchar first_name
    varchar last_name
    timestamp last_update
  }
  film {
    int film_id PK
    varchar title
    text description
    year release_year
    int language_id FK
    int original_language_id FK
    smallint rental_duration
    numeric rental_rate
    smallint length
    numeric replacement_cost
    enum rating
    timestamp last_update
  }
  film_actor {
    int actor_id FK
    int film_id FK
    timestamp last_update
  }
  category {
    int category_id PK
    varchar name
    timestamp last_update
  }
  film_category {
    int film_id FK
    int category_id FK
    timestamp last_update
  }
  language {
    int language_id PK
    char name
    timestamp last_update
  }
  inventory {
    int inventory_id PK
    int film_id FK
    int store_id FK
    timestamp last_update
  }
  rental {
    int rental_id PK
    timestamp rental_date
    int inventory_id FK
    int customer_id FK
    timestamp return_date
    int staff_id FK
    timestamp last_update
  }
  payment {
    int payment_id PK
    int customer_id FK
    int staff_id FK
    int rental_id FK
    numeric amount
    timestamp payment_date
  }
  customer {
    int customer_id PK
    int store_id FK
    varchar first_name
    varchar last_name
    varchar email
    int address_id FK
    boolean activebool
    date create_date
    timestamp last_update
    int active
  }
  staff {
    int staff_id PK
    varchar first_name
    varchar last_name
    int address_id FK
    varchar email
    int store_id FK
    boolean active
    varchar username
    timestamp last_update
  }
  store {
    int store_id PK
    int manager_staff_id FK
    int address_id FK
    timestamp last_update
  }
  address {
    int address_id PK
    varchar address
    varchar address2
    varchar district
    int city_id FK
    varchar postal_code
    varchar phone
    timestamp last_update
  }
  city {
    int city_id PK
    varchar city
    int country_id FK
    timestamp last_update
  }
  country {
    int country_id PK
    varchar country
    timestamp last_update
  }

  actor ||--o{ film_actor : "actúa en"
  film ||--o{ film_actor : "tiene actores"
  film ||--o{ film_category : "pertenece a"
  category ||--o{ film_category : "clasifica"
  language ||--o{ film : "idioma"
  film ||--o{ inventory : "en stock"
  store ||--o{ inventory : "almacena"
  inventory ||--o{ rental : "se alquila"
  customer ||--o{ rental : "realiza"
  staff ||--o{ rental : "gestiona"
  rental ||--o{ payment : "genera"
  customer ||--o{ payment : "paga"
  staff ||--o{ payment : "cobra"
  store ||--o{ staff : "emplea"
  store ||--|| staff : "dirigida por"
  customer ||--|| address : "vive en"
  staff ||--|| address : "trabaja en"
  store ||--|| address : "ubicada en"
  address ||--|| city : "en"
  city ||--|| country : "en"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
